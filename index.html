<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16223A">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Office Work — to-do, calendar, notes, legal cases and premises register for NIACL estate work.">
<title>Office Work Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* Apply the saved theme before first paint, so there is no light flash in dark mode. */
(function(){try{var s=JSON.parse(localStorage.getItem('niaclOfficeWork.v2')||'{}');var t=(s.settings&&s.settings.theme)||'auto';
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';
document.documentElement.dataset.density=(s.settings&&s.settings.density)||'compact';}catch(e){document.documentElement.dataset.theme='light';}})();
</script>
<style>
:root{
  --f-ui:'IBM Plex Sans Condensed','Roboto Condensed','Arial Narrow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-text:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --fs:13px; --fs-s:11.5px; --fs-l:15px; --ctl:28px; --rp:4px 7px; --gap:8px; --rad:6px;
  --side-w:200px; --hdr-h:96px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root[data-density="comfortable"]{--fs:14px;--fs-s:12.5px;--fs-l:16px;--ctl:34px;--rp:7px 9px;--gap:10px}
@media (pointer:coarse){:root{--ctl:32px}:root[data-density="comfortable"]{--ctl:38px}}

/* Light: cool ledger paper, navy ink */
:root,:root[data-theme="light"]{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface2:#F6F8FA; --hover:#EEF2F7; --ink:#16223A; --ink2:#4F5B6E; --ink3:#7C8798;
  --rule:#D3DAE3; --rule2:#E6EAF0; --side:#16223A; --side-ink:#C9D3E3; --side-ink2:#8794AB; --side-hi:#22314F;
  --red:#B02A21; --red-soft:#FBE9E7; --amber:#8A5A00; --amber-soft:#FBF1DD; --green:#2B6B3A; --green-soft:#E6F2E9;
  --blue:#23468C; --blue-soft:#E7EDF8; --shadow:0 6px 24px rgba(22,34,58,.16);
  --c-todo:#2A5A94; --c-cal:#A3501C; --c-notes:#97305A; --c-cases:#5A3E9B; --c-prem:#2B6B3A; --c-rep:#3F4B5E;
  --scrim:rgba(14,20,32,.45); color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface2:#1B2330; --hover:#212B3A; --ink:#E3E8F0; --ink2:#A7B1C2; --ink3:#7B879A;
  --rule:#2B3546; --rule2:#222B39; --side:#0A0F16; --side-ink:#BCC6D6; --side-ink2:#6F7C91; --side-hi:#1C2534;
  --red:#F0857C; --red-soft:#3A1C1A; --amber:#E8B656; --amber-soft:#33280F; --green:#79C48A; --green-soft:#16301D;
  --blue:#8DAEEB; --blue-soft:#18253D; --shadow:0 8px 28px rgba(0,0,0,.5);
  --c-todo:#7FA8E0; --c-cal:#E4945C; --c-notes:#E07FA8; --c-cases:#B39DE6; --c-prem:#7CC48D; --c-rep:#A9B6CB;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
body[data-sec="todo"]{--acc:var(--c-todo)} body[data-sec="cal"]{--acc:var(--c-cal)} body[data-sec="notes"]{--acc:var(--c-notes)}
body[data-sec="cases"]{--acc:var(--c-cases)} body[data-sec="prem"]{--acc:var(--c-prem)} body[data-sec="rep"]{--acc:var(--c-rep)}
body{--acc-soft:color-mix(in srgb,var(--acc) 13%,var(--surface))}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 var(--fs)/1.4 var(--f-ui);font-variant-numeric:tabular-nums;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--acc,#5A86D6);outline-offset:1px;border-radius:4px}
.hidden{display:none!important}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100dvh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;padding:12px 8px;gap:10px;z-index:40}
.brand{padding:4px 8px 8px;border-bottom:1px solid var(--side-hi)}
.brand b{display:block;font-size:15px;font-weight:700;color:#fff;letter-spacing:.01em}
.brand span{display:block;font-size:11px;color:var(--side-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;color:var(--side-ink);font-weight:500;font-size:13.5px;position:relative}
.nav button svg{width:17px;height:17px;flex:none;opacity:.85}
.nav button:hover{background:var(--side-hi)}
.nav button .ct{margin-left:auto;font-size:11px;color:var(--side-ink2);font-weight:600}
.nav button[aria-current="page"]{background:var(--side-hi);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:4px;border-radius:0 3px 3px 0;background:var(--navc)}
.nav button:focus-visible{outline:2px solid #8DAEEB}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--side-hi);padding-top:8px}
.side-foot button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;font-size:12.5px;color:var(--side-ink);white-space:nowrap}
.side-foot button:hover{background:var(--side-hi)}
.side-foot svg{width:15px;height:15px;flex:none}
.side-foot .saved{font-size:10.5px;color:var(--side-ink2);padding:2px 9px}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--rule);padding:8px 14px 0;padding-top:calc(8px + var(--safe-t))}
.bar-r1{display:flex;align-items:center;gap:10px;min-height:30px}
.bar h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.bar h1 i{width:10px;height:10px;border-radius:2px;background:var(--acc);display:inline-block}
.bar .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{width:var(--ctl);height:var(--ctl);display:inline-grid;place-items:center;border:1px solid var(--rule);background:var(--surface);border-radius:var(--rad);cursor:pointer;color:var(--ink2);padding:0}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.subtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:6px -2px 0}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{all:unset;cursor:pointer;padding:6px 10px 7px;font-weight:600;font-size:12.5px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button i{font-style:normal;font-weight:500;color:var(--ink3);margin-left:4px;font-size:11px}
.subtabs button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
.subtabs button:hover{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 0 8px}
.view{padding:10px 14px 28px;min-width:0}

/* ---------- Controls ---------- */
.btn{height:var(--ctl);padding:0 10px;border:1px solid var(--rule);background:var(--surface);border-radius:var(--rad);cursor:pointer;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0E131B}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--rule))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:24px;padding:0 7px;font-size:11.5px}
.btn small{font-weight:400;color:inherit;opacity:.75;font-size:10.5px}
.search{display:flex;align-items:center;gap:6px;height:var(--ctl);border:1px solid var(--rule);border-radius:var(--rad);padding:0 8px;background:var(--surface);flex:1 1 200px;max-width:340px;min-width:150px}
.search svg{width:14px;height:14px;color:var(--ink3);flex:none}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px;height:100%}
select.sel,input.inp{height:var(--ctl);border:1px solid var(--rule);border-radius:var(--rad);background:var(--surface);padding:0 6px;font-size:12.5px;max-width:200px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:24px;padding:0 8px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip i{font-style:normal;color:var(--ink3);font-weight:500}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink3))}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--rad);overflow:hidden;height:var(--ctl)}
.seg button{border:0;background:var(--surface);padding:0 9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc)}
.spacer{flex:1}
.count-note{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.tools .count-note{white-space:normal}
.fx{display:contents} .fx-btn{display:none} .fx-btn.on{border-color:var(--acc);color:var(--acc)}
table.dt th.act{right:0;z-index:3}
table.dt td.act{position:sticky;right:0;background:var(--surface);box-shadow:-6px 0 6px -6px rgba(0,0,0,.18)}
table.dt tbody tr:hover td.act{background:var(--hover)}
@media (max-width:999px){table.dt .hm{display:none}}

/* ---------- Data table ---------- */
.tbl-wrap{background:var(--surface);border:1px solid var(--rule);border-radius:var(--rad);overflow:auto;max-height:calc(100dvh - var(--hdr-h) - 30px)}
.view.flow .tbl-wrap{max-height:none}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--fs)}
table.dt th{position:sticky;top:0;z-index:2;background:var(--surface2);text-align:left;font-weight:600;font-size:11.5px;color:var(--ink2);padding:5px 7px;border-bottom:1px solid var(--rule);white-space:nowrap;user-select:none}
table.dt th.s{cursor:pointer}
table.dt th.s:hover{color:var(--ink)}
table.dt th .ar{font-size:9px;margin-left:3px;color:var(--acc)}
table.dt td{padding:var(--rp);border-bottom:1px solid var(--rule2);vertical-align:top}
table.dt tbody tr:hover td{background:var(--hover)}
table.dt tr.grp td{background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:12px;padding:5px 8px;position:sticky;top:26px;z-index:1}
table.dt td.num{text-align:right;white-space:nowrap}
table.dt td.act{white-space:nowrap;text-align:right;width:1%}
table.dt td .t1{font-weight:600}
table.dt td .t2{color:var(--ink2);font-size:var(--fs-s)}
table.dt tr.over td:first-child{box-shadow:inset 3px 0 var(--red)}
table.dt tr.soon td:first-child{box-shadow:inset 3px 0 var(--amber)}
table.dt tr.today td:first-child{box-shadow:inset 3px 0 var(--green)}
table.dt td.wrap{white-space:pre-line;min-width:140px}
table.dt td.w2{min-width:200px}
table.dt tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:700;border-top:1px solid var(--rule);padding:5px 7px}
.rowbtn{all:unset;cursor:pointer;width:24px;height:24px;display:inline-grid;place-items:center;border-radius:5px;color:var(--ink3)}
.rowbtn:hover{background:var(--rule2);color:var(--ink)}
.rowbtn svg{width:15px;height:15px}
.tick{all:unset;cursor:pointer;width:18px;height:18px;border:1.5px solid var(--ink3);border-radius:4px;display:inline-grid;place-items:center;font-size:12px;color:transparent;flex:none}
.tick:hover{border-color:var(--green);color:var(--green)}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}

/* Cards (phone) */
.cards{display:flex;flex-direction:column;gap:6px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--rad);padding:7px 9px;display:flex;gap:8px;align-items:flex-start;position:relative}
.card.over{border-left:3px solid var(--red)} .card.soon{border-left:3px solid var(--amber)} .card.today{border-left:3px solid var(--green)}
.card .cb{flex:1;min-width:0}
.card .l1{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.card .l1 b{font-weight:600;font-size:13.5px}
.card .l2{color:var(--ink2);font-size:12px;margin-top:1px}
.card .l3{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.card .dstamp{flex-direction:row;gap:5px;align-items:baseline;min-width:0}
.card .rm{font-size:12px;color:var(--ink2);margin-top:3px;white-space:pre-line;font-family:var(--f-text)}
.grp-h{font-weight:700;font-size:12px;color:var(--acc);padding:8px 2px 3px;display:flex;gap:6px;align-items:center}
.grp-h::after{content:"";flex:1;height:1px;background:var(--rule)}
.grp-h small{color:var(--ink3);font-weight:500}

/* Tags, badges, date stamps */
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;background:var(--rule2);color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.red{background:var(--red-soft);color:var(--red)} .tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.green{background:var(--green-soft);color:var(--green)} .tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.acc{background:var(--acc-soft);color:var(--acc)}
.fb{display:inline-grid;place-items:center;min-width:32px;height:18px;padding:0 4px;border-radius:4px;font-size:10.5px;font-weight:700;color:#fff;background:var(--fc);letter-spacing:.02em}
.dstamp{display:inline-flex;flex-direction:column;line-height:1.15;min-width:74px}
.dstamp b{font-weight:700;font-size:12.5px}
.dstamp span{font-size:10.5px;color:var(--ink3)}
.dstamp.over b{color:var(--red)} .dstamp.today b{color:var(--green)} .dstamp.soon b{color:var(--amber)}
.dstamp.none b{color:var(--ink3);font-weight:500}
.pill-stage{all:unset;cursor:pointer;font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;border:1px dashed var(--ink3);color:var(--ink2)}
.pill-stage.set{border-style:solid;border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}

/* Panels & overview */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:10px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:10px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--rad);padding:10px 12px}
.panel h2{font-size:14px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.panel h2 small{font-weight:500;color:var(--ink3);font-size:11.5px}
.panel p.d{color:var(--ink2);font-size:12.5px;margin-bottom:8px;font-family:var(--f-text)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;margin-bottom:10px}
.kpi{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:var(--rad);padding:7px 9px;border-top:3px solid var(--c,var(--acc))}
.kpi:hover{background:var(--hover)}
.kpi b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--ink2)}
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini td{padding:4px 4px;border-bottom:1px solid var(--rule2);vertical-align:top}
.mini tr:last-child td{border-bottom:0}
.mini tr.clk{cursor:pointer} .mini tr.clk:hover td{background:var(--hover)}
.empty{padding:26px 14px;text-align:center;color:var(--ink2);background:var(--surface);border:1px dashed var(--rule);border-radius:var(--rad);font-family:var(--f-text)}
.empty b{display:block;color:var(--ink);font-family:var(--f-ui);font-size:14px;margin-bottom:4px}
.empty .btn{margin-top:10px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--blue-soft);border:1px solid color-mix(in srgb,var(--blue) 35%,var(--rule));color:var(--ink);border-radius:var(--rad);padding:8px 10px;margin-bottom:10px;font-size:12.5px}
.banner.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 40%,var(--rule))}
.prop-card{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--rule);border-radius:var(--rad);padding:9px 11px;border-left:4px solid var(--c-prem)}
.prop-card:hover{background:var(--hover)}
.prop-card h3{font-size:14px;font-weight:700}
.prop-card .ad{font-size:11.5px;color:var(--ink3);margin:1px 0 6px}
.prop-card .st{display:flex;flex-wrap:wrap;gap:4px}
.hist{border-left:2px solid var(--rule);margin:4px 0 0 4px;padding-left:10px}
.hist div{padding:3px 0;font-size:12.5px;font-family:var(--f-text)}
.hist div b{font-family:var(--f-ui);font-size:11.5px;color:var(--ink3);margin-right:6px}

/* Notes */
.notes-grid{columns:4 260px;column-gap:8px}
.note{break-inside:avoid;margin-bottom:8px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--rad);padding:8px 10px;border-top:3px solid var(--nc,var(--c-notes))}
.note .nt{font-weight:700;font-size:13px;margin-bottom:2px}
.note .nb{white-space:pre-wrap;font-family:var(--f-text);font-size:12.5px;line-height:1.45;word-break:break-word}
.note .nf{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--ink3)}
.note .nf .rowbtn{margin-left:auto}

/* Calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:10px;align-items:start}
.cal{background:var(--surface);border:1px solid var(--rule);border-radius:var(--rad);overflow:hidden}
.cal .dow,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .dow span{font-size:11px;font-weight:600;color:var(--ink3);padding:4px 6px;border-bottom:1px solid var(--rule)}
.cal .cell{all:unset;cursor:pointer;min-height:76px;border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2);padding:3px 4px;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.cal .cell:nth-child(7n){border-right:0}
.cal .cell .dn{font-size:11.5px;font-weight:600;color:var(--ink2)}
.cal .cell.out{background:var(--surface2)} .cal .cell.out .dn{color:var(--ink3)}
.cal .cell.today .dn{background:var(--acc);color:#fff;border-radius:9px;padding:0 6px;align-self:flex-start}
.cal .cell.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.cal .cell:hover{background:var(--hover)}
.ev{font-size:10.5px;line-height:1.3;padding:0 4px;border-radius:3px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink);border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{opacity:.5;text-decoration:line-through}
.ev-more{font-size:10px;color:var(--ink3)}
.agenda .dayh{font-weight:700;font-size:12.5px;padding:8px 2px 4px;display:flex;gap:6px;color:var(--ink)}
.agenda .dayh span{color:var(--ink3);font-weight:500}
.occ{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--c);border-radius:var(--rad);padding:6px 8px;margin-bottom:5px}
.occ.done .ttl{text-decoration:line-through;color:var(--ink3)}
.occ .tm{font-size:11.5px;font-weight:600;color:var(--c)}
.occ .ttl{font-weight:600}
.occ .nn{font-size:12px;color:var(--ink2);white-space:pre-line;font-family:var(--f-text)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}

<script>
'use strict';
/* =====================================================================
   Office Work Register — single-file app (GitHub Pages / Android WebView)
   Sections: To-Do · Calendar · Notes · Cases · Premises · Reports
   All data stays in this browser (localStorage). Reports > Backup moves it.
   ===================================================================== */
const KEY = 'niaclOfficeWork.v2';
const SCHEMA = 2;
const APP_ID = 'niacl-office-work';

/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const dObj = iso => { const [y,m,d] = String(iso).split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (iso, n) => { const d = dObj(iso); d.setDate(d.getDate()+n); return isoOf(d); };
const daysTo = iso => iso ? Math.round((dObj(iso) - dObj(todayISO())) / 864e5) : null;
const validISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
function fmt(iso){ if(!validISO(iso)) return iso || ''; const [y,m,d] = iso.split('-'); return `${d}.${m}.${y}`; }
function fmtS(iso){ if(!validISO(iso)) return ''; const d = dObj(iso); return `${pad(d.getDate())} ${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + String(d.getFullYear()).slice(2) : ''}`; }
function longDate(iso){ const d = dObj(iso); return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; }
function fmtTime(t){ if(!t) return ''; let [h,m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const escBr = s => esc(s).replace(/\n/g, '<br>');
const numOf = v => { const t = String(v ?? '').replace(/[,\s]/g, '').replace(/^Rs\.?/i, ''); return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : null; };
const inr = n => Number(n).toLocaleString('en-IN');
const norm = s => String(s ?? '').toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
function hiQ(text, q){ const s = esc(text); if(!q) return s; const t = q.trim(); if(!t) return s;
  try{ return s.replace(new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); }catch(e){ return s; } }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- reference lists ---------- */
const FORUMS = [
  {code:'EO',  name:'Estate Officer',     full:"Hon'ble Estate Officer",          color:'#5A3E9B'},
  {code:'SC',  name:'Supreme Court',      full:"Hon'ble Supreme Court",           color:'#7A1F3D'},
  {code:'HC',  name:'High Court',         full:"Hon'ble Bombay High Court",       color:'#23468C'},
  {code:'CCC', name:'City Civil Court',   full:"Hon'ble Bombay City Civil Court", color:'#2F6B3B'},
  {code:'SCC', name:'Small Causes Court', full:"Hon'ble Small Causes Court",      color:'#8A5A00'},
  {code:'OTH', name:'Other forum',        full:'Other forum',                      color:'#5D6679'}
];
const FORUM = Object.fromEntries(FORUMS.map(f => [f.code, f]));
const fc = code => (FORUM[code] || FORUM.OTH).color;
const forumBadge = code => `<span class="fb" style="--fc:${fc(code)}" title="${esc((FORUM[code]||FORUM.OTH).name)}">${esc(code || 'OTH')}</span>`;
const PROCESSES = ['Investigation','Investigator appointed','Notice of Termination to be sent','Notice of Termination served',
  'Application to be filed','Valuation','Notice to vacate','Settlement talks','Other'];
const OUTCOMES = ['Disposed','Dismissed','Withdrawn','Final order passed','Possession received','Settled / consent terms','Vacated','Case filed','Other'];
const STATUSES = ['Pending','Admitted','Pre-Admission Fresh','Sine die','Reserved for orders'];
const DEFAULT_STAGES = ['Call','Meeting','Approval','Voucher','Draft','Email','Filing','Follow up','Payment','Vetting','Scan','Waiting'];
const REPEATS = [['none','Does not repeat'],['daily','Every day'],['weekdays','Every weekday (Mon–Fri)'],['weekly','Every week'],
  ['fortnightly','Every 2 weeks'],['monthly','Every month'],['yearly','Every year']];
const REPEAT_LABEL = Object.fromEntries(REPEATS);
const REMINDS = [['off','Off'],['0','At start time'],['5','5 minutes before'],['10','10 minutes before'],['15','15 minutes before'],
  ['30','30 minutes before'],['60','1 hour before'],['1440','1 day before']];
const REMIND_LABEL = Object.fromEntries(REMINDS);
const COLORS = [{k:'blue',n:'Blue',h:'#2A5A94'},{k:'green',n:'Green',h:'#1C6B58'},{k:'red',n:'Red',h:'#B0312A'},{k:'orange',n:'Orange',h:'#C2641A'},
  {k:'purple',n:'Purple',h:'#5B3E8E'},{k:'teal',n:'Teal',h:'#15788A'},{k:'pink',n:'Pink',h:'#B0376E'},{k:'grey',n:'Grey',h:'#5E6B77'}];
const colorHex = k => (COLORS.find(c => c.k === k) || COLORS[0]).h;

/* Default premises. Each has keywords used to link cases and lists to it automatically. */
const DEFAULT_PROPS = [
  {id:'mayfair', name:'Mayfair Complex', short:'Mayfair', addr:'Little Gibbs Road, Malabar Hill, Mumbai 400 006',
   blocks:'Mayfair Gardens (A, B, C wings), Mayfair House, servant quarters, New Chawl, garages', keys:'mayfair, mfg, new chawl, little gibbs', notes:''},
  {id:'nic', name:'New India Centre', short:'NIC', addr:'17, Cooperage Road, Mumbai 400 039', blocks:'North wing, South wing', keys:'new india centre, new india center, cooperage', notes:''},
  {id:'nib', name:'New India Building, Fort', short:'NIB Fort', addr:'87, M.G. Road, Fort, Mumbai 400 001', blocks:'', keys:'new india bldg, new india building, new india assurance building, m.g. road, m. g. road, fort, mumbai 400 001', notes:''},
  {id:'nsq', name:'New India Staff Quarters, Andheri', short:'Staff Qtrs Andheri', addr:'34, Barfiwala Road, Juhu Lane, Andheri (West), Mumbai 400 058', blocks:'', keys:'staff quarters, barfiwala, andheri', notes:''},
  {id:'bennevis', name:'Ben-Nevis', short:'Ben-Nevis', addr:'Bhulabhai Desai Road, Mumbai 400 026', blocks:'', keys:'ben-nevis, ben nevis, bhulabhai', notes:''},
  {id:'apollo', name:'Apollo Reclamation plot', short:'Apollo plot', addr:'Old R.R. No. 647, Apollo Reclamation Estate, Mumbai', blocks:'', keys:'apollo reclamation, r.r. no. 647', notes:''}
];

/* ---------- state ---------- */
let state;
function blankPremises(){ return {props: clone(DEFAULT_PROPS), flats:[], areas:[], quarters:[], garages:[], recovered:[], notes:{}}; }
function seedState(){
  return {app:APP_ID, schema:SCHEMA,
    settings:{org:'The New India Assurance Co. Ltd.', title:'Status of Pending Cases', subtitle:'Properties owned by New India Assurance', theme:'auto', density:'compact', view:'auto', hearingsInCal:true, dueInCal:true},
    todo:[], done:[], stages:[...DEFAULT_STAGES], events:[], notes:[],
    cases:[], pipeline:[], closed:[], premises:blankPremises(),
    meta:{savedAt:null, backupAt:null, migratedFrom:[]}};
}
const blankCase = () => ({id:uid('c'), forum:'EO', caseNo:'', party:'', prop:'', unit:'', property:'', status:'', stage:'', nextDate:'', time:'', lastDate:'', dateNote:'', filedOn:'', advocate:'', oppAdvocate:'', valuer:'', remarks:'', history:[], updated:todayISO()});
const blankPipe = () => ({id:uid('t'), prop:'', property:'', flat:'', party:'', process:'Investigation', status:'', advocate:'', oppAdvocate:'', forum:'', targetDate:'', notes:'', history:[], updated:todayISO()});

/* Normalise any state object to the current schema (fills missing fields, keeps unknown ones). */
function normalize(s){
  const base = seedState();
  s = Object.assign(base, s || {});
  s.app = APP_ID; s.schema = SCHEMA;
  s.settings = Object.assign(seedState().settings, s.settings || {});
  s.meta = Object.assign({savedAt:null, backupAt:null, migratedFrom:[]}, s.meta || {});
  const arr = (a, f) => (Array.isArray(a) ? a : []).filter(x => x && typeof x === 'object').map(f);
  s.todo = arr(s.todo, t => Object.assign({id:uid('k'), title:'', start:'', due:'', stage:'', notes:''}, t));
  s.done = arr(s.done, t => Object.assign({id:uid('k'), title:'', start:'', due:'', stage:'', notes:'', completedOn:''}, t));
  s.stages = Array.isArray(s.stages) && s.stages.length ? s.stages.filter(x => typeof x === 'string' && x.trim()) : [...DEFAULT_STAGES];
  s.events = arr(s.events, e => Object.assign({id:uid('e'), title:'', date:todayISO(), start:'', end:'', repeat:'none', until:'', color:'blue', remind:'off', notes:'', done:{}}, e, {done: (e.done && typeof e.done === 'object') ? e.done : {}}));
  s.notes = arr(s.notes, n => Object.assign({id:uid('n'), date:todayISO(), title:'', content:'', pinned:false, color:''}, n));
  s.cases = arr(s.cases, c => Object.assign(blankCase(), c, {history: Array.isArray(c.history) ? c.history : []}));
  s.pipeline = arr(s.pipeline, t => Object.assign(blankPipe(), t, {history: Array.isArray(t.history) ? t.history : []}));
  s.closed = arr(s.closed, x => Object.assign({kind:'case', outcome:'', closedOn:'', note:'', data:{}}, x));
  const P = s.premises = Object.assign(blankPremises(), s.premises || {});
  P.props = arr(P.props, p => Object.assign({id:uid('pp'), name:'', short:'', addr:'', blocks:'', keys:'', notes:''}, p));
  if(!P.props.length) P.props = clone(DEFAULT_PROPS);
  ['flats','areas','quarters','garages','recovered'].forEach(k => P[k] = arr(P[k], x => Object.assign({id:uid('p'), prop:''}, x)));
  P.notes = P.notes && typeof P.notes === 'object' ? P.notes : {};
  linkAll(s);
  return s;
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const s = JSON.parse(raw); if(s && typeof s === 'object') return normalize(s); } }
  catch(e){ console.warn('Load failed', e); }
  return normalize(seedState());
}
let saveWarned = false;
function save(){
  state.meta.savedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ if(!saveWarned){ saveWarned = true; toast('This browser blocked saving. Download a backup from Reports so nothing is lost.'); } }
  const el = $('#savedAt'); if(el) el.textContent = 'Saved ' + new Date().toTimeString().slice(0,5);
}

/* ---------- linking records to premises ---------- */
function propKeys(p){ return String(p.keys || '').split(',').map(k => k.trim().toLowerCase()).filter(Boolean).concat(p.name ? [p.name.toLowerCase()] : []); }
function detectProp(text, s = state){
  const t = norm(text); if(!t.trim()) return '';
  /* Longest keyword wins, so "New India Centre" beats "Fort"-style generic words. */
  let best = '', len = 0;
  s.premises.props.forEach(p => propKeys(p).forEach(k => { if(k && t.includes(k) && k.length > len){ best = p.id; len = k.length; } }));
  return best;
}
function unitFrom(text){
  const m = String(text || '').match(/flat\s*no\.?\s*([A-Z]?[\s\/\-]?\d+[A-Z]?(?:[\/\-]\d+[A-Z]?)*)/i);
  return m ? m[1].replace(/\s+/g, '').toUpperCase() : '';
}
function linkAll(s){
  s.cases.forEach(c => { if(!c.prop) c.prop = detectProp(c.property, s); if(!c.unit) c.unit = unitFrom(c.property); });
  s.pipeline.forEach(t => { if(!t.prop) t.prop = detectProp(t.property + ' ' + t.flat, s); });
  const P = s.premises;
  P.flats.forEach(x => { if(!x.prop) x.prop = detectProp(x.building, s); });
  P.areas.forEach(x => { if(!x.prop) x.prop = detectProp(x.building, s); });
  P.quarters.forEach(x => { if(!x.prop) x.prop = detectProp(x.block + ' mayfair', s) || 'mayfair'; });
  P.garages.forEach(x => { if(!x.prop) x.prop = 'mayfair'; });
  P.recovered.forEach(x => { if(!x.prop) x.prop = detectProp(x.property, s); });
}
const propById = id => state.premises.props.find(p => p.id === id);
const propName = id => { const p = propById(id); return p ? p.name : ''; };
const propShort = id => { const p = propById(id); return p ? (p.short || p.name) : ''; };
const flatKey = u => String(u || '').toUpperCase().replace(/^FLAT\s*(NO\.?)?\s*/, '').replace(/[\s\-]/g, '/').replace(/\/+/g, '/');
const isNIA = s => /new india|niacl/i.test(s || '') || /(^|[^A-Za-z])N\.?I\.?A\.?([^A-Za-z]|$)/.test(s || '');

/* =====================================================================
   Migration: older apps and older backup files → current schema
   ===================================================================== */
/* Returns {label, data:{section:payload}} or null. data keys: todo, done, stages, events, notes,
   cases, pipeline, closed, premises, settings. Every key is optional. */
function convertAny(json){
  if(!json || typeof json !== 'object') return null;
  // 1. This app (full or section backup)
  if(json.app === APP_ID){
    const src = json.data && typeof json.data === 'object' ? json.data : json;
    const out = {};
    ['todo','done','stages','events','notes','cases','pipeline','closed','premises','settings'].forEach(k => { if(src[k] !== undefined) out[k] = src[k]; });
    return {label:`Office Work backup (${json.scope || 'all sections'}, saved ${json.exportedAt ? fmt(json.exportedAt.slice(0,10)) : 'date unknown'})`, data:out};
  }
  // 2. Legal Case Register (v1): {version, settings, cases, tenants, closed, premises}
  if(Array.isArray(json.cases) || Array.isArray(json.tenants) || (json.premises && typeof json.premises === 'object' && !json.app)){
    return {label:'Legal Case Register backup (older app) — converted', data:fromCaseRegister(json)};
  }
  // 3. Office Register master backup: {app:'office-register', data:{todo, done, routine, notes, expense, focus}, stages}
  if(json.app === 'office-register' || (json.data && (Array.isArray(json.data.todo) || Array.isArray(json.data.routine)))){
    return {label:'Office Register backup (older app) — converted (Claims and Focus left out)', data:fromOfficeRegister(json.data || json, json.stages)};
  }

function mergeById(cur, inc){
  const out = cur.slice(), idx = new Map(out.map((r, i) => [r.id, i])); let added = 0, updated = 0;
  inc.forEach(r => { if(r.id && idx.has(r.id)){ out[idx.get(r.id)] = r; updated++; } else { out.push(r); added++; } });

function applyImport(data, keys, mode){
  let added = 0, updated = 0;

    if(k === 'settings'){ Object.assign(state.settings, Object.fromEntries(Object.entries(v).filter(([,x]) => x !== undefined && x !== null))); return; }

}

const STOP = /^(for|of|the|to|and|&|with|in|on|at|a|an|by|from|re)$/i;
function shortName(s, max = 16){

/* Reminders: notify while the app is open (Android WebView/APK can wire this to native alarms). */
const FIRED_KEY = 'niaclOfficeWork.fired';
function askNotify(){ try{ if('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }catch(e){} }
function checkReminders(){
  let fired = {}; try{ fired = JSON.parse(localStorage.getItem(FIRED_KEY) || '{}'); }catch(e){}
  const now = Date.now(), t = todayISO();
  [addDays(t, -1), t, addDays(t, 1)].forEach(day => state.events.forEach(e => {
    if(!e.remind || e.remind === 'off' || !occursOn(e, day) || (e.done || {})[day]) return;
    const [h, m] = (e.start || '09:00').split(':').map(Number), at = dObj(day); at.setHours(h, m, 0, 0);
    const when = at.getTime() - Number(e.remind) * 60000, k = e.id + '@' + day;
    if(now >= when && now - when < 6 * 3600e3 && !fired[k]){
      fired[k] = 1; const msg = `${e.title} — ${e.start ? fmtTime(e.start) : 'today'}${day !== t ? ' (' + fmtS(day) + ')' : ''}`;
      toast('🔔 ' + msg);
      try{ if('Notification' in window && Notification.permission === 'granted') new Notification('Office Work reminder', {body:msg, tag:k}); }catch(err){}
      try{ if(window.AndroidBridge && AndroidBridge.notify) AndroidBridge.notify('Reminder', msg); }catch(err){}
    }
  }));
  const keep = {}; Object.keys(fired).forEach(k => { if(k.split('@')[1] >= addDays(t, -3)) keep[k] = 1; });
  try{ localStorage.setItem(FIRED_KEY, JSON.stringify(keep)); }catch(e){}
}
/* .ics file for Samsung Calendar / Google Calendar import. */
function icsFor(list){
  const RR = {daily:'FREQ=DAILY', weekdays:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly:'FREQ=WEEKLY', fortnightly:'FREQ=WEEKLY;INTERVAL=2', monthly:'FREQ=MONTHLY', yearly:'FREQ=YEARLY'};
  const st = (d, t) => d.replace(/-/g, '') + 'T' + (t || '09:00').replace(':', '') + '00';
  const clean = s => String(s || '').replace(/[,;\\]/g, ' ').replace(/\n/g, '\\n');
  const n = new Date(), stamp = `${n.getUTCFullYear()}${pad(n.getUTCMonth()+1)}${pad(n.getUTCDate())}T${pad(n.getUTCHours())}${pad(n.getUTCMinutes())}00Z`;
  const ev = list.map(e => {
    const s = e.start || '09:00'; let en = e.end, ed = e.date;
    if(!en){ const [h, m] = s.split(':').map(Number), x = (h * 60 + m + 30) % 1440; en = `${pad(Math.floor(x / 60))}:${pad(x % 60)}`; }
    if(en < s) ed = addDays(e.date, 1);
    let rule = RR[e.repeat]; if(rule && e.until) rule += ';UNTIL=' + e.until.replace(/-/g, '') + 'T235900';
    const r = e.remind && e.remind !== 'off' ? ['BEGIN:VALARM', `TRIGGER:${e.remind === '0' ? 'PT0M' : e.remind === '1440' ? '-P1D' : '-PT' + e.remind + 'M'}`, 'ACTION:DISPLAY', `DESCRIPTION:${clean(e.title)}`, 'END:VALARM'] : [];
    return ['BEGIN:VEVENT', `UID:${e.id}@office-work`, `DTSTAMP:${stamp}`, `DTSTART:${st(e.date, s)}`, `DTEND:${st(ed, en)}`, `SUMMARY:${clean(e.title)}`, e.notes ? `DESCRIPTION:${clean(e.notes)}` : '', rule ? `RRULE:${rule}` : '', ...r, 'END:VEVENT'].filter(Boolean).join('\r\n');
  }).join('\r\n');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Office Work//EN', 'CALSCALE:GREGORIAN', ev, 'END:VCALENDAR'].join('\r\n');
}

      {k:'outcome', l:'Outcome', h:x => `<span class="tag green">${esc(x.outcome)}</span>${x.note ? `<div class="t2">${esc(x.note)}</div>` : ''}`},

    card:x => `<div class="card"><div class="cb"><div class="l1">${x.kind === 'case' ? forumBadge(x.data.forum) : '<span class="tag">Pipeline</span>'}<b>${esc(x.data.party)}</b></div><div class="l2" style="white-space:pre-line">${esc(x.kind === 'case' ? x.data.caseNo : 'Flat ' + x.data.flat)}</div>

      <div style="display:flex;flex-direction:column;gap:10px">
        ${over.length ? `<section class="panel"><h2 style="color:var(--red)">Date passed — enter the next date <small>${over.length}</small></h2><table class="mini">${over.map(row).join('')}</table></section>` : ''}
        <section class="panel"><h2>Pipeline by process <small>${state.pipeline.length}</small></h2><table class="mini">${Object.entries(procCount).sort((a, b) => PROCESSES.indexOf(a[0]) - PROCESSES.indexOf(b[0])).map(([p, n]) => `<tr class="clk" data-act="p-proc" data-p="${esc(p)}"><td><span class="tag ${procCls(p)}">${esc(p)}</span></td><td class="num"><b>${n}</b></td></tr>`).join('') || '<tr><td class="faint">Nothing in the pipeline.</td></tr>'}</table></section>

function caseForm(c, preset, onDone){
  const isNew = !c;
  formModal({title:isNew ? 'New case' : 'Edit case', wide:true, fields:caseFields(), data:c || Object.assign(blankCase(), preset || {}),
    onSave(v){
      if(!v.prop) v.prop = detectProp(v.property); if(!v.unit) v.unit = unitFrom(v.property);
      if(isNew){ const x = Object.assign(blankCase(), preset || {}, v, {updated:todayISO()}); x.history = (preset && preset.history || []).concat([{d:todayISO(), t:'Case entered in the register.'}]); state.cases.push(x); if(onDone) onDone(x); }
      else { Object.assign(c, v, {updated:todayISO()}); }
      save(); render(); toast(isNew ? 'Case added' : 'Case updated');
    },
    onDelete: isNew ? null : async () => { if(await askConfirm(`Delete <b>${esc(c.party)}</b> (${esc(firstLine(c.caseNo))}) permanently? Use “Mark as closed” instead to keep it for reference.`, 'Delete', true)){ closeTop(); delCase(c); } }});
}
function delCase(c){ const i = state.cases.indexOf(c); if(i < 0) return; state.cases.splice(i, 1); save(); render(); toast('Case deleted', {fn:() => { state.cases.splice(i, 0, c); save(); render(); }}); }
function hearingForm(c){
  formModal({title:'Update after hearing', saveLabel:'Save update',
    fields:[{k:'nextDate', l:'Next date', type:'date'}, {k:'time', l:'Time', type:'time'},
      {k:'stage', l:'Stage / purpose of next date', full:1, list:allCaseLike().map(x => x.stage)},
      {k:'status', l:'Status', list:[...STATUSES, ...state.cases.map(x => x.status)]}, {k:'dateNote', l:'If date not fixed', ph:'e.g. Next date awaited'},
      {k:'note', l:'What happened (added to history)', type:'textarea', rows:3, full:1, ph:'e.g. Matter adjourned at request of respondent'}],
    data:{nextDate:c.nextDate && c.nextDate >= todayISO() ? c.nextDate : '', time:c.time, stage:c.stage, status:c.status, dateNote:c.dateNote},
    onSave(v){
      const prev = c.nextDate;
      if(prev && prev !== v.nextDate && prev <= todayISO()) c.lastDate = prev;
      const parts = [];
      if(v.note) parts.push(v.note.replace(/\.+$/, ''));
      if(v.nextDate !== c.nextDate) parts.push(v.nextDate ? `Next date ${fmt(v.nextDate)}${v.time ? ' at ' + fmtTime(v.time) : ''}` : 'Next date not fixed');
      if(v.stage !== c.stage && v.stage) parts.push(`Stage: ${v.stage}`);
      Object.assign(c, {nextDate:v.nextDate, time:v.time, stage:v.stage, status:v.status, dateNote:v.nextDate ? '' : v.dateNote, updated:todayISO()});
      if(parts.length) c.history.push({d:todayISO(), t:parts.join('. ')});
      save(); render(); toast('Hearing update saved');
    }});
  // show which case this is
  const mb = $$('.modal .mb').pop(); if(mb) mb.insertAdjacentHTML('afterbegin', `<p style="margin-bottom:8px">${forumBadge(c.forum)} <b>${esc(c.party)}</b><br><span class="faint">${esc(c.caseNo.replace(/\n/g, ' · '))}${c.nextDate ? ' · last listed ' + fmt(c.nextDate) : ''}</span></p>`);
}

function closeForm(rec, kind){

    {name:'word/document.xml', data:doc}, {name:'word/styles.xml', data:styles}, {name:'word/footer1.xml', data:footer}]);

/* ---------- HTML (preview & print) ---------- */
function reportHTML(rep, forPrint){
  const tables = rep.blocks.map(b => {
    const cols = b.P.cols, tw = cols.reduce((n, c) => n + (c.w || 10), 0);
    return `<h3>${esc(b.heading)} <span style="font-weight:normal;color:#666">(${b.count})</span></h3><table><colgroup>${cols.map(c => `<col style="width:${(100 * (c.w || 10) / tw).toFixed(2)}%">`).join('')}</colgroup>
      <thead><tr>${cols.map(c => `<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${b.P.rows.map(r => `<tr>${r.map((v, i) => `<td${cols[i].num ? ' class="n"' : ''}>${escBr(cols[i].date && validISO(v) ? fmt(v) : cols[i].num && numOf(v) !== null ? inr(numOf(v)) : v)}</td>`).join('')}</tr>`).join('')}</tbody>
      ${b.P.total ? `<tfoot><tr>${b.P.total.map(v => `<td class="${typeof v === 'number' ? 'n' : ''}">${esc(typeof v === 'number' ? inr(v) : v)}</td>`).join('')}</tr></tfoot>` : ''}</table>`;
  }).join('');
  const head = `<div class="hd"><b>${esc(rep.org)}</b><div>${esc(rep.title)} (as on ${fmt(rep.asOn)})</div>${rep.sub ? `<div class="s">${esc(rep.sub)}</div>` : ''}</div>`;
  if(!forPrint) return head + (tables || '<p>Nothing to show for this choice.</p>');
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(rep.title)}</title><style>
    @page{size:A4 landscape;margin:10mm}body{font:8.5pt/1.3 Arial,sans-serif;color:#111;margin:0}
    .hd{text-align:center;margin-bottom:8px}.hd b{font-size:13pt;display:block}.hd div{font-weight:bold;font-size:10pt}.hd .s{font-weight:normal;color:#555}
    h3{font-size:9.5pt;color:#23468C;margin:10px 0 3px;page-break-after:avoid}table{border-collapse:collapse;width:100%;table-layout:fixed;margin-bottom:6px}
    th{background:#23468C;color:#fff;text-align:left;padding:3px 4px;border:1px solid #9AA3B5;font-size:8pt}td{padding:2px 4px;border:1px solid #9AA3B5;vertical-align:top;word-wrap:break-word}
    thead{display:table-header-group}tr{page-break-inside:avoid}td.n{text-align:right}tfoot td{font-weight:bold;background:#F2F4F7}
    .gen{color:#777;font-size:7.5pt;margin-top:8px}</style></head><body>${head}${tables}<div class="gen">Generated ${fmt(todayISO())} ${new Date().toTimeString().slice(0, 5)}</div></body></html>`;
}
function printReport(rep){
  const html = reportHTML(rep, true);
  if(window.AndroidBridge && AndroidBridge.printHtml){ AndroidBridge.printHtml(rep.title, html); toast('Choose “Save as PDF” to keep a PDF copy.'); return; }
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(f);
  const d = f.contentWindow.document; d.open(); d.write(html); d.close();
  setTimeout(() => { try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ deliver(new Blob([html], {type:'text/html'}), rep.name + '.html'); toast('Printing is blocked here — report saved as HTML instead.'); } setTimeout(() => f.remove(), 3000); }, 300);
}

/* ---------- PDF (jsPDF from CDN; falls back to the print dialog offline) ---------- */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function loadPdfLib(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return;
  const tries = [['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'],
    ['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js']];
  for(const [a, b] of tries){ try{ if(!(window.jspdf && window.jspdf.jsPDF)) await loadScript(a); await loadScript(b); if(window.jspdf.jsPDF.API.autoTable) return; }catch(e){} }
  throw new Error('pdf library unavailable');
}
const pdfTxt = s => String(s ?? '').replace(/₹/g, 'Rs.').replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...').replace(/[^\x09\x0A\x0D\x20-\xFF]/g, '');
async function pdfReport(rep){
  toast('Preparing PDF…');
  try{ await loadPdfLib(); }catch(e){ toast('PDF library needs internet. Opening print instead — choose “Save as PDF”.'); return printReport(rep); }
  const {jsPDF} = window.jspdf, doc = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
  const W = doc.internal.pageSize.getWidth(), M = 10;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.text(pdfTxt(rep.org), W / 2, 13, {align:'center'});
  doc.setFontSize(10.5); doc.text(pdfTxt(`${rep.title} (as on ${fmt(rep.asOn)})`), W / 2, 19, {align:'center'});
  let y = 23; if(rep.sub){ doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(80); doc.text(pdfTxt(rep.sub), W / 2, 23.5, {align:'center'}); doc.setTextColor(0); y = 27; }
  rep.blocks.forEach(b => {
    const cols = b.P.cols, tw = cols.reduce((n, c) => n + (c.w || 10), 0), avail = W - 2 * M;
    if(y > 180){ doc.addPage(); y = 14; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(35, 70, 140); doc.text(pdfTxt(`${b.heading}  (${b.count})`), M, y + 3); doc.setTextColor(0);
    doc.autoTable({startY:y + 5, margin:{left:M, right:M, top:12, bottom:12}, theme:'grid',
      head:[cols.map(c => pdfTxt(c.h))], body:b.P.rows.map(r => r.map((v, i) => pdfTxt(cols[i].date && validISO(v) ? fmt(v) : cols[i].num && numOf(v) !== null ? inr(numOf(v)) : v)))
        .concat(b.P.total ? [b.P.total.map(v => pdfTxt(typeof v === 'number' ? inr(v) : v))] : []),
      didParseCell(d){ if(d.section === 'body' && b.P.total && d.row.index === b.P.rows.length){ d.cell.styles.fontStyle = 'bold'; d.cell.styles.fillColor = [242, 244, 247]; } },
      styles:{font:'helvetica', fontSize:7.6, cellPadding:1.2, lineColor:[154, 163, 181], lineWidth:0.15, valign:'top', overflow:'linebreak'},
      headStyles:{fillColor:[35, 70, 140], textColor:255, fontStyle:'bold', fontSize:7.8},
      columnStyles:Object.fromEntries(cols.map((c, i) => [i, {cellWidth:avail * (c.w || 10) / tw, halign:c.num ? 'right' : 'left'}]))});
    y = doc.lastAutoTable.finalY + 7;
  });
  const n = doc.internal.getNumberOfPages();
  for(let i = 1; i <= n; i++){ doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(120);
    doc.text(pdfTxt(`${rep.org} — ${rep.title}`), M, doc.internal.pageSize.getHeight() - 5); doc.text(`Page ${i} of ${n}`, W - M, doc.internal.pageSize.getHeight() - 5, {align:'right'}); }
  deliver(doc.output('blob'), `${rep.name}_${fileStamp()}.pdf`);
}
/* ---------- deliver a file (browser download, or the Android app's save bridge) ---------- */
function deliver(blob, name){
  if(window.AndroidBridge && AndroidBridge.saveFile){
    const r = new FileReader(); r.onload = () => { try{ AndroidBridge.saveFile(name, blob.type || 'application/octet-stream', String(r.result).split(',')[1], true); toast('Saved ' + name); }catch(e){ toast('Could not save the file.'); } }; r.readAsDataURL(blob); return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Downloaded ' + name);
}
const deliverText = (name, text, type) => deliver(new Blob([text], {type}), name);
async function runExport(rep, fmtType){
  if(!rep.blocks.length){ toast('Nothing to export for this choice.'); return; }
  if(fmtType === 'xlsx') deliver(new Blob([xlsxBlob(rep)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `${rep.name}_${fileStamp()}.xlsx`);
  else if(fmtType === 'docx') deliver(new Blob([docxBlob(rep)], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}), `${rep.name}_${fileStamp()}.docx`);
  else if(fmtType === 'pdf') await pdfReport(rep);
  else printReport(rep);
}
/* Export button in each section: exports exactly what is on screen (search, filters and sort applied). */
function quickExport(what){
  const C = ui.cases, pr = ui.prem;
  const map = {
    todo:() => buildReport({type:'todo', rows:todoRows()}), done:() => buildReport({type:'done', rows:todoRows()}), notes:() => buildReport({type:'notes', rows:noteRows()}),
    filed:() => buildReport({type:'filed', rows:sortRows(filteredCases(), C.sort, CASE_COLS)}), pipeline:() => buildReport({type:'pipeline', rows:sortRows(filteredPipe(), C.psort, PIPE_COLS)}),
    diary:() => buildReport({type:'diary', from:ui.rep.from, to:ui.rep.to}), closed:() => buildReport({type:'closed'}), full:() => buildReport({type:'full', closed:false}),
    prop:() => buildReport({type:'prop', prop:pr.tab}), recovered:() => buildReport({type:'recovered'}), 'prem-type':() => buildReport({type:'prem-type', seg:pr.allType}),
    'prem-all':() => buildReport({type:'prem-all'}), events:() => { const [a, b] = calRange(); return buildReport({type:'events', from:a, to:b}); }};
  const rep = map[what](); const n = rep.blocks.reduce((k, b) => k + b.count, 0);
  menu(`Export — ${rep.title} (${n} rows)`, [
    {ic:'📊', l:'Excel (.xlsx)', d:'Formatted sheets, frozen header, A4 landscape print setup', fn:() => runExport(rep, 'xlsx')},
    {ic:'📄', l:'Word (.docx)', d:'Landscape tables with repeating header rows', fn:() => runExport(rep, 'docx')},
    {ic:'📕', l:'PDF', d:'A4 landscape with page numbers', fn:() => runExport(rep, 'pdf')},
    {ic:'🖨', l:'Print', d:'Browser print dialog', fn:() => runExport(rep, 'print')}]);
}

<script>
/* =====================================================================
   Reports page, backup & restore, global search, event wiring, start-up
   ===================================================================== */
const BACKUP_SCOPES = [
  {k:'todo', l:'To-Do', d:() => `${state.todo.length} open, ${state.done.length} completed`, keys:['todo','done','stages']},
  {k:'cal', l:'Calendar', d:() => plural(state.events.length, 'event'), keys:['events']},
  {k:'notes', l:'Notes', d:() => plural(state.notes.length, 'note'), keys:['notes']},
  {k:'cases', l:'Cases', d:() => `${state.cases.length} filed, ${state.pipeline.length} pipeline, ${state.closed.length} closed`, keys:['cases','pipeline','closed']},
  {k:'premises', l:'Premises', d:() => `${state.premises.props.length} properties, ${countOf('premises', state.premises)} list entries`, keys:['premises']},
  {k:'all', l:'Everything', d:() => 'All sections and settings in one file', keys:['todo','done','stages','events','notes','cases','pipeline','closed','premises','settings']}];
function backup(scope){
  const sc = BACKUP_SCOPES.find(s => s.k === scope);
  const data = Object.fromEntries(sc.keys.map(k => [k, k === 'settings' ? {org:state.settings.org, title:state.settings.title, subtitle:state.settings.subtitle} : state[k]]));
  const payload = {app:APP_ID, schema:SCHEMA, scope:sc.l, exportedAt:new Date().toISOString(), data};
  deliverText(`office-work-${scope}-backup_${fileStamp()}.json`, JSON.stringify(payload, null, 1), 'application/json');
  if(scope === 'all'){ state.meta.backupAt = new Date().toISOString(); save(); if(ui.sec === 'rep') render(); }
}
function pickRestore(){ const f = $('#fileIn'); f.value = ''; f.click(); }
$('#fileIn').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if(!file) return;
  let json; try{ json = JSON.parse(await file.text()); }catch(err){ toast('That file is not a valid JSON backup.'); return; }
  const conv = convertAny(json);
  if(!conv){ toast('This file was not recognised as a backup of this app or the older apps.'); return; }
  restoreDialog(conv, file.name);
});
function restoreDialog(conv, fname){
  const keys = SECTION_LIST.filter(s => conv.data[s.k] !== undefined && (countOf(s.k, conv.data[s.k]) || s.k === 'settings' || s.k === 'stages'));
  if(!keys.length){ toast('The file has no entries to restore.'); return; }
  const empty = !state.cases.length && !state.todo.length && !state.notes.length && !countOf('premises', state.premises);
  openModal({title:'Restore from backup', wide:true,
    body:`<p style="margin-bottom:6px"><b>${esc(fname || '')}</b><br><span class="faint">${esc(conv.label)}</span></p>
      <p class="faint" style="margin-bottom:6px">Tick the sections to restore:</p>
      <div class="checks">${keys.map(s => `<label><input type="checkbox" name="rk" value="${s.k}" checked><b>${esc(s.l)}</b><span>${s.k === 'settings' ? '' : s.k === 'stages' ? conv.data.stages.length + ' stages' : plural(countOf(s.k, conv.data[s.k]), 'entry', 'entries')}</span></label>`).join('')}</div>
      <p class="faint" style="margin:10px 0 6px">How to restore:</p>
      <div class="checks"><label><input type="radio" name="rm" value="merge" ${empty ? '' : 'checked'}><b>Merge</b><span>keep what is here, add new entries, update matching ones</span></label>
      <label><input type="radio" name="rm" value="replace" ${empty ? 'checked' : ''}><b>Replace</b><span>ticked sections are replaced by the file</span></label></div>`,
    foot:`<button class="btn" data-x>Cancel</button><button class="btn pri" data-go>Restore</button>`,
    onMount(r){ r.querySelector('[data-go]').addEventListener('click', () => {
      const ks = $$('input[name=rk]:checked', r).map(x => x.value), mode = (r.querySelector('input[name=rm]:checked') || {}).value || 'merge';
      if(!ks.length){ toast('Tick at least one section.'); return; }
      const res = applyImport(conv.data, ks, mode); closeTop(); render();
      toast(mode === 'replace' ? `Restored ${res.added} entries.` : `Restored: ${res.added} added, ${res.updated} updated.`);
    }); }});
}
function legacyImport(){
  const found = legacyOnDevice(); if(!found.length){ toast('No data from the older apps was found on this device.'); return; }
  const data = {}; found.forEach(f => Object.assign(data, f.data));
  const keys = SECTION_LIST.filter(s => data[s.k] !== undefined).map(s => s.k);
  const res = applyImport(data, keys, 'merge'); state.meta.migratedFrom.push(...found.map(f => f.key)); save(); render();
  toast(`Brought in ${res.added} entries from ${found.map(f => f.label).join(' and ')}.`);
}

/* ---------- Reports page ---------- */
const REP_TYPES = [
  ['Cases', [['full','Full status report (forum-wise, then pipeline)'],['filed','Pending cases (all or one forum)'],['pipeline','Cases yet to be filed (pipeline)'],['diary','Hearing diary (date range)'],['closed','Closed matters']]],
  ['Premises', [['prop','Property dossier (everything for one property)'],['prem-type','One premises list for all properties'],['recovered','Recovery of possession & damages'],['prem-all','All premises lists']]],
  ['Office', [['todo','To-Do (open tasks)'],['done','Completed tasks'],['events','Calendar (date range)'],['notes','Notes']]],
  ['Everything', [['everything','Complete register — every section']]]];
function repOpts(){
  const r = ui.rep, t = todayISO(); if(!r.from) r.from = t; if(!r.to) r.to = addDays(t, 30);
  if(r.prop === 'ALL' || !propById(r.prop)) r.prop = (state.premises.props[0] || {}).id || '';

}

    ${lastB === null || lastB < -7 ? `<div class="banner warn">${lastB === null ? 'No full backup has been downloaded from this device yet.' : `Last full backup was ${-lastB} days ago.`} Entries live only in this browser — download a backup to keep them safe. <button class="btn" data-act="backup" data-k="all">Download full backup</button></div>` : ''}
    <div class="grid2">
      <section class="panel"><h2>Print or export</h2><p class="d">Choose what goes into the report, then Excel, Word, PDF or print. Excel and Word files are created on the device, no internet needed.</p>
        <div class="f-grid" style="margin-bottom:8px">
          <label class="fld full"><span>Report</span><select id="rtype">${REP_TYPES.map(([g, list]) => `<optgroup label="${g}">${list.map(([v, l]) => `<option value="${v}" ${r.type === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</optgroup>`).join('')}</select></label>
          <label class="fld" id="o-forum"><span>Forum</span><select id="rforum"><option value="ALL">All forums</option>${FORUMS.map(f => `<option value="${f.code}" ${r.forum === f.code ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select></label>
          <label class="fld" id="o-closed"><span>Also include</span><select id="rclosed"><option value="0">Nothing else</option><option value="1" ${r.closed ? 'selected' : ''}>Closed matters at the end</option></select></label>
          <label class="fld" id="o-prop"><span>Property</span><select id="rprop">${state.premises.props.map(p => `<option value="${p.id}" ${r.prop === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
          <label class="fld" id="o-seg"><span>List</span><select id="rseg">${PSEG_KEYS.map(k => `<option value="${k}" ${(r.seg || 'flats') === k ? 'selected' : ''}>${esc(PSEG[k].label)}</option>`).join('')}</select></label>
          <label class="fld" id="o-from"><span>From</span><input type="date" id="rfrom" value="${r.from || todayISO()}"></label>
          <label class="fld" id="o-to"><span>To</span><input type="date" id="rto" value="${r.to || addDays(todayISO(), 30)}"></label>
        </div>

          <button class="btn pri" data-act="rep-run" data-f="pdf">PDF <small>A4 landscape</small></button><button class="btn" data-act="rep-run" data-f="print">Print</button></div>
        <p class="count-note" id="repCount" style="margin:8px 0 4px"></p><div class="preview" id="repPrev"></div>
      </section>
      <div style="display:flex;flex-direction:column;gap:10px">
        <section class="panel"><h2>Backup <small>${state.meta.backupAt ? 'last full backup ' + fmt(state.meta.backupAt.slice(0, 10)) : 'never'}</small></h2>
          <p class="d">Each button saves a .json file. Back up one section, or everything together.</p>
          <table class="mini">${BACKUP_SCOPES.map(s => `<tr><td><b>${s.l}</b><div class="faint" style="font-size:11.5px">${esc(s.d())}</div></td><td class="num"><button class="btn ${s.k === 'all' ? 'pri' : ''} sm" data-act="backup" data-k="${s.k}">${IC.export}Download</button></td></tr>`).join('')}</table>
          <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-act="restore">Restore from backup…</button></div>
          <p class="faint" style="font-size:11.5px;margin-top:6px">Restore reads backups of this app, of the Legal Case Register (older app) and of the Office Register (older app). You choose which sections to restore and whether to merge or replace.</p>
        </section>
        <section class="panel"><h2>Report heading</h2>
          <div class="f-grid"><label class="fld full"><span>Organisation</span><input id="s-org" value="${esc(S.org)}"></label><label class="fld full"><span>Cases report title</span><input id="s-title" value="${esc(S.title)}"></label>
          <label class="fld full"><span>Second line <em>optional</em></span><input id="s-sub" value="${esc(S.subtitle || '')}"></label></div>
          <div style="margin-top:8px"><button class="btn" data-act="save-heading">Save heading</button></div></section>
        <section class="panel"><h2>Display</h2>
          <table class="mini"><tr><td>Theme</td><td class="num">${seg('theme', S.theme, [['auto','Auto'],['light','Light'],['dark','Dark']])}</td></tr>
          <tr><td>Text & buttons</td><td class="num">${seg('density', S.density, [['compact','Compact'],['comfortable','Comfortable']])}</td></tr>
          <tr><td>Lists</td><td class="num">${seg('view', S.view, [['auto','Auto'],['table','Table'],['cards','Cards']])}</td></tr>
          <tr><td>Show court hearings in Calendar</td><td class="num">${seg('hearingsInCal', String(S.hearingsInCal !== false), [['true','Yes'],['false','No']])}</td></tr>
          <tr><td>Show task due dates in Calendar</td><td class="num">${seg('dueInCal', String(S.dueInCal !== false), [['true','Yes'],['false','No']])}</td></tr></table>
          <p class="faint" style="font-size:11.5px;margin-top:6px">Auto shows tables on tablets and laptops and compact cards on phones.</p></section>
        <section class="panel"><h2>This device</h2><p class="d">Last saved: ${state.meta.savedAt ? fmt(state.meta.savedAt.slice(0, 10)) + ' ' + new Date(state.meta.savedAt).toTimeString().slice(0, 5) : 'not yet'}. Storage used: ${(new Blob([localStorage.getItem(KEY) || '']).size / 1024).toFixed(0)} KB.</p>
          <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-act="legacy-import">Look for older app data</button><button class="btn dng" data-act="reset">Clear all data…</button></div></section>
      </div></div>`;
  const sync = () => {
    r.type = $('#rtype').value; r.forum = $('#rforum').value; r.closed = $('#rclosed').value === '1'; r.prop = $('#rprop').value; r.seg = $('#rseg').value; r.from = $('#rfrom').value; r.to = $('#rto').value;
    const show = (id, on) => { $('#' + id).style.display = on ? '' : 'none'; };
    show('o-forum', r.type === 'full' || r.type === 'filed'); show('o-closed', r.type === 'full'); show('o-prop', r.type === 'prop'); show('o-seg', r.type === 'prem-type');
    show('o-from', ['diary','events','everything'].includes(r.type)); show('o-to', ['diary','events','everything'].includes(r.type));
    const rep = buildReport(repOpts()), n = rep.blocks.reduce((k, b) => k + b.count, 0);
    $('#repCount').textContent = `Preview: ${rep.blocks.length} table${rep.blocks.length === 1 ? '' : 's'}, ${n} rows`;
    $('#repPrev').innerHTML = reportHTML(rep);
  };
  $$('#rtype,#rforum,#rclosed,#rprop,#rseg,#rfrom,#rto').forEach(el => el.addEventListener('change', sync));
  sync();
}
function applyTheme(){
  const t = state.settings.theme, dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.density = state.settings.density || 'compact';
  const m = $('meta[name=theme-color]'); if(m) m.content = dark ? '#0A0F16' : '#16223A';
}

/* ---------- global search ---------- */
function globalSearch(){
  if(modals.length && $('#gsq')) return;
  openModal({title:'Search everything', wide:true, foot:false,
    body:`<label class="search" style="max-width:none;margin-bottom:8px">${IC.search}<input type="search" id="gsq" placeholder="Name, flat no., case no., advocate, task, note…" autofocus autocomplete="off"></label><div class="srch-res" id="gsr"><p class="faint">Type at least 2 letters.</p></div>`,
    onMount(r){ const inp = $('#gsq', r); inp.addEventListener('input', debounce(() => gsRun(inp.value), 120)); setTimeout(() => inp.focus(), 50); }});
}
function gsRun(q){
  const box = $('#gsr'); if(!box) return;
  if(q.trim().length < 2){ box.innerHTML = '<p class="faint">Type at least 2 letters.</p>'; return; }
  const P = state.premises, groups = [
    ['Filed cases', state.cases, c => [c.party, `${c.forum} ${firstLine(c.caseNo)} · ${propShort(c.prop)} ${c.unit} · next ${fmt(c.nextDate) || 'not fixed'}`], c => `data-act="case-open" data-id="${c.id}"`],
    ['Pipeline (to be filed)', state.pipeline, t => [t.party, `${propShort(t.prop) || t.property} flat ${t.flat} · ${t.process}`], t => `data-act="pipe-open" data-id="${t.id}"`],
    ['Flats / floors', P.flats, x => [`${x.unit} — ${x.name}`, `${propShort(x.prop)} · ${x.building} ${x.wing} ${x.current ? '· in use: ' + x.current : ''}`], x => `data-act="prem-edit" data-seg="flats" data-id="${x.id}"`],
    ['Area & rent', P.areas, x => [`${x.unit || x.sr} — ${x.name}`, `${propShort(x.prop)} · ${x.area} sq.ft · Rs. ${x.rent}`], x => `data-act="prem-edit" data-seg="areas" data-id="${x.id}"`],
    ['Servant quarters', P.quarters, x => [`Q ${x.unit} — ${x.name}`, `${x.block} · ${x.occupants}`], x => `data-act="prem-edit" data-seg="quarters" data-id="${x.id}"`],
    ['Garages', P.garages, x => [`G ${x.unit} — ${x.name}`, `Flat ${x.flat}`], x => `data-act="prem-edit" data-seg="garages" data-id="${x.id}"`],
    ['Recovered', P.recovered, x => [x.name, `${x.property} · ${x.status}`], x => `data-act="prem-edit" data-seg="recovered" data-id="${x.id}"`],
    ['Closed matters', state.closed, x => [x.data.party, `${x.outcome} ${fmt(x.closedOn)}`], () => 'data-act="go" data-sec="cases" data-tab="closed"'],
    ['To-Do', state.todo, t => [t.title, `Due ${fmt(t.due) || '—'} · ${t.stage || 'no stage'}`], t => `data-act="todo-edit" data-id="${t.id}"`],
    ['Completed tasks', state.done, t => [t.title, `Completed ${fmt(t.completedOn)}`], t => `data-act="done-edit" data-id="${t.id}"`],
    ['Calendar events', state.events, e => [e.title, `${fmt(e.date)} ${e.start ? fmtTime(e.start) : ''} · ${REPEAT_LABEL[e.repeat]}`], e => `data-act="ev-edit" data-id="${e.id}"`],
    ['Notes', state.notes, n => [n.title || n.content.slice(0, 60), n.content.slice(0, 120)], n => `data-act="note-edit" data-id="${n.id}"`]];
  let total = 0;
  const html = groups.map(([label, list, show, attr]) => {
    const hits = list.filter(x => matchQ(x, q)); total += hits.length; if(!hits.length) return '';
    return `<div class="grp-h">${label} <small>${hits.length}</small></div>${hits.slice(0, 8).map(x => { const [a, b] = show(x); return `<button class="hit" ${attr(x)} data-gs="1"><b>${hiQ(a, q)}</b><span>${hiQ(b, q)}</span></button>`; }).join('')}${hits.length > 8 ? `<p class="faint" style="font-size:11.5px">+ ${hits.length - 8} more — use the search box in that section.</p>` : ''}`;
  }).join('');
  box.innerHTML = total ? html : `<p class="faint">Nothing found for “${esc(q)}”.</p>`;
}

/* ---------- event wiring (one listener for every button) ---------- */
const findCase = id => state.cases.find(c => c.id === id);
const findPipe = id => state.pipeline.find(t => t.id === id);
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if(b.dataset.gs && modals.length) closeTop();
  const later = fn => setTimeout(fn, b.dataset.gs ? 90 : 0);
  switch(a){
    case 'go': go(b.dataset.sec, b.dataset.tab ? {tab:b.dataset.tab} : null); break;
    case 'theme': { const dark = document.documentElement.dataset.theme === 'dark'; state.settings.theme = dark ? 'light' : 'dark'; save(); applyTheme(); render(); break; }
    case 'global-search': globalSearch(); break;
    case 'fx': ui.fxOpen = !ui.fxOpen; $('#bar').classList.toggle('fx-open', ui.fxOpen); b.setAttribute('aria-expanded', ui.fxOpen); syncHdr(); break;
    case 'toggle-view': state.settings.view = useCards() ? 'table' : 'cards'; save(); render(); break;
    case 'set': { const k = b.dataset.k; let v = b.dataset.v; if(v === 'true' || v === 'false') v = v === 'true'; state.settings[k] = v; save(); applyTheme(); render(); break; }
    case 'sort': {
      const list = b.dataset.list, k = b.dataset.k;
      const st = list === 'todo' ? ui.todo : list === 'cases' ? ui.cases : list === 'pipe' ? {get sort(){ return ui.cases.psort; }, set sort(v){ ui.cases.psort = v; }} : list === 'prem' ? ui.prem : null;
      if(!st) break;
      if(list === 'prem' && st.sort && st.sort.k === k && st.sort.d === -1) st.sort = null; else toggleSort(st, k);
      ({todo:drawTodo, cases:drawCases, pipe:() => ui.sec === 'prem' ? drawPrem() : drawCases(), prem:drawPrem})[list](); break; }
    /* To-Do */
    case 'todo-tab': ui.todo.view = b.dataset.tab; ui.todo.f = 'all'; ui.todo.q = ''; renderTodo(); break;
    case 'todo-add': todoForm(null); break;
    case 'todo-done': completeTask(id); break;
    case 'todo-reopen': reopenTask(id); break;
    case 'todo-stage': stagePicker(id); break;
    case 'todo-edit': later(() => { go('todo', {view:'open'}); const t = state.todo.find(x => x.id === id); if(t) todoForm(t); }); break;
    case 'done-edit': later(() => { go('todo', {view:'done'}); const t = state.done.find(x => x.id === id); if(t) todoForm(t, true); }); break;
    case 'todo-menu': { const t = state.todo.find(x => x.id === id); if(!t) break;
      menu(t.title, [{ic:'✓', l:'Mark completed', fn:() => completeTask(id)}, {ic:'✎', l:'Edit', fn:() => todoForm(t)}, {ic:'⇄', l:'Set progress stage', fn:() => stagePicker(id)},
        {ic:'⧉', l:'Duplicate', fn:() => { state.todo.unshift(Object.assign(clone(t), {id:uid('k')})); save(); render(); toast('Duplicated'); }},
        {ic:'🗑', l:'Delete', danger:1, fn:() => removeTask(t, false)}]); break; }
    case 'done-menu': { const t = state.done.find(x => x.id === id); if(!t) break;
      menu(t.title, [{ic:'↺', l:'Reopen task', fn:() => reopenTask(id)}, {ic:'✎', l:'Edit (details or completion date)', fn:() => todoForm(t, true)}, {ic:'🗑', l:'Delete permanently', danger:1, fn:() => removeTask(t, true)}]); break; }
    /* Calendar */
    case 'cal-view': ui.cal.view = b.dataset.tab; if(ui.cal.view === 'month') ui.cal.cursor = ui.cal.sel; renderCal(); break;
    case 'cal-step': calStep(+b.dataset.n); renderCal(); break;
    case 'cal-today': ui.cal.sel = ui.cal.cursor = todayISO(); renderCal(); break;
    case 'cal-day': ui.cal.sel = b.dataset.day; if(isPhone() || true) drawCal(); break;
    case 'cal-show': { const k = b.dataset.k; if(k === 'hear'){ state.settings.hearingsInCal = !(state.settings.hearingsInCal !== false); save(); } else if(k === 'due'){ state.settings.dueInCal = !(state.settings.dueInCal !== false); save(); } else ui.cal.show.ev = !ui.cal.show.ev; renderCal(); break; }
    case 'cal-more': menu('Calendar', [
      {ic:'🗓', l:'Send all events to phone calendar', d:'.ics file with repeat rules and reminders (Samsung / Google Calendar)', fn:() => { if(!state.events.length) return toast('No events to send.'); deliverText('office-work-events.ics', icsFor(state.events), 'text/calendar'); }},
      {ic:'⚖', l:'Send coming hearings to phone calendar', d:'Hearings from today onward, reminder a day before', fn:() => { const h = state.cases.filter(c => c.nextDate >= todayISO()); if(!h.length) return toast('No coming hearings.'); deliverText('hearings.ics', icsFor(h.map(hearingAsEvent)), 'text/calendar'); }},
      {ic:'🔔', l:'Allow reminder notifications', fn:() => { askNotify(); toast('Reminders pop up while the app is open.'); }},
      {ic:'📊', l:'Export what is shown', fn:() => quickExport('events')}]); break;
    case 'ev-add': evForm(null); break;
    case 'ev-tick': evTick(id, b.dataset.day); break;
    case 'ev-edit': later(() => { const ev = state.events.find(x => x.id === id); if(ev){ ui.cal.sel = ui.cal.cursor = ev.date; go('cal'); evForm(ev); } }); break;
    case 'ev-menu': { const ev = state.events.find(x => x.id === id); if(!ev) break;
      menu(ev.title, [{ic:'✎', l:'Edit', fn:() => evForm(ev)}, {ic:'🗓', l:'Add to phone calendar', d:'.ics file', fn:() => deliverText('event.ics', icsFor([ev]), 'text/calendar')},
        {ic:'⧉', l:'Duplicate', fn:() => { state.events.unshift(Object.assign(clone(ev), {id:uid('e'), done:{}})); save(); render(); }},
        {ic:'🗑', l:'Delete', danger:1, fn:async () => { if(await askConfirm(`Delete <b>${esc(ev.title)}</b>?`, 'Delete', true)){ state.events.splice(state.events.indexOf(ev), 1); save(); render(); toast('Deleted'); } }}]); break; }
    /* Notes */
    case 'note-add': noteForm(null); break;
    case 'note-edit': later(() => { const n = state.notes.find(x => x.id === id); if(n){ if(ui.sec !== 'notes') go('notes'); noteForm(n); } }); break;
    /* Cases */
    case 'cases-tab': ui.cases.tab = b.dataset.tab; if(ui.sec !== 'cases') go('cases'); else renderCases(); break;
    case 'c-forum': ui.cases.forum = b.dataset.f; renderCases(); break;
    case 'c-goto': Object.assign(ui.cases, {tab:'filed', forum:b.dataset.f, when:'ALL', prop:'ALL', adv:'ALL', q:''}); renderCases(); break;
    case 'c-when': Object.assign(ui.cases, {tab:'filed', forum:'ALL', when:b.dataset.w, prop:'ALL', adv:'ALL', q:'', sort:{k:'nextDate', d:1}}); renderCases(); break;
    case 'p-proc': Object.assign(ui.cases, {tab:'pipeline', pproc:b.dataset.p, pprop:'ALL', pq:''}); renderCases(); break;
    case 'case-add': caseForm(null, ui.sec === 'prem' && propById(ui.prem.tab) ? {prop:ui.prem.tab, property:propById(ui.prem.tab).name + ', ' + propById(ui.prem.tab).addr} : null); break;
    case 'case-hear': { const c = findCase(id); if(c) hearingForm(c); break; }
    case 'case-menu': { const c = findCase(id); if(c) caseMenu(c); break; }
    case 'case-open': later(() => { const c = findCase(id); if(c) caseMenu(c); }); break;
    case 'pipe-add': pipeForm(ui.sec === 'prem' && propById(ui.prem.tab) ? Object.assign(blankPipe(), {prop:ui.prem.tab, property:propById(ui.prem.tab).name}) : null); break;
    case 'pipe-upd': { const t = findPipe(id); if(t) pipeUpdate(t); break; }
    case 'pipe-menu': { const t = findPipe(id); if(t) pipeMenu(t); break; }
    case 'pipe-open': later(() => { const t = findPipe(id); if(t) pipeMenu(t); }); break;
    case 'closed-restore': restoreClosed(id); break;
    case 'closed-del': { const i = state.closed.findIndex(x => x.data.id === id); if(i >= 0 && await askConfirm('Delete this closed matter permanently?', 'Delete', true)){ state.closed.splice(i, 1); save(); render(); toast('Deleted'); } break; }
    case 'diary-range': ui.rep.from = todayISO(); ui.rep.to = addDays(todayISO(), +b.dataset.d); renderCases(); break;
    /* Premises */
    case 'prem-tab': ui.prem.tab = b.dataset.tab; ui.prem.sub = null; ui.prem.q = ''; ui.prem.blk = 'ALL'; ui.prem.held = 'ALL'; ui.prem.sort = null; if(ui.sec !== 'prem') go('prem'); else renderPrem(); break;
    case 'prem-open': openProp(id, b.dataset.sub); break;
    case 'p-sub': ui.prem.sub = b.dataset.sub; ui.prem.q = ''; ui.prem.blk = 'ALL'; ui.prem.sort = null; renderPrem(); break;
    case 'p-held': ui.prem.held = b.dataset.h; renderPrem(); break;
    case 'prem-add': premForm(b.dataset.seg, null); break;
    case 'prem-edit': later(() => { const x = state.premises[b.dataset.seg].find(r => r.id === id); if(x) premForm(b.dataset.seg, x); }); break;
    case 'prop-add': propForm(null); break;
    case 'prop-edit': propForm(propById(id)); break;
    /* Reports */
    case 'quick-export': quickExport(b.dataset.what); break;
    case 'rep-run': runExport(buildReport(repOpts()), b.dataset.f); break;
    case 'backup': backup(b.dataset.k); break;
    case 'restore': pickRestore(); break;
    case 'legacy-import': legacyImport(); break;
    case 'save-heading': state.settings.org = $('#s-org').value.trim(); state.settings.title = $('#s-title').value.trim(); state.settings.subtitle = $('#s-sub').value.trim(); save(); render(); toast('Heading saved'); break;
    case 'reset': if(await askConfirm('Remove <b>every</b> task, event, note, case and premises entry from this browser? Download a full backup first.', 'Clear all data', true)){
      if(await askConfirm('This cannot be undone. Clear everything now?', 'Yes, clear', true)){ const keep = state.settings; state = normalize(seedState()); state.settings.theme = keep.theme; save(); render(); toast('All data cleared from this device'); } } break;
  }
});

/* ---------- start-up ---------- */
state = load();
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(state.settings.theme === 'auto'){ applyTheme(); render(); } });
let lastPhone = isPhone();
addEventListener('resize', debounce(() => { syncHdr(); if(isPhone() !== lastPhone){ lastPhone = isPhone(); render(); } }, 150));
const startSec = location.hash.slice(1);
ui.sec = SECTIONS.some(s => s.id === startSec) ? startSec : 'todo';
/* First run with data from the older apps on the same site: bring it in automatically. */
(function firstRun(){
  const empty = !state.todo.length && !state.cases.length && !state.notes.length && !state.events.length && !countOf('premises', state.premises);
  const found = legacyOnDevice();
  if(empty && found.length && !localStorage.getItem(KEY)){ legacyImport(); }
})();
render();
$('#savedAt').textContent = state.meta.savedAt ? 'Saved ' + fmt(state.meta.savedAt.slice(0, 10)) : '';
checkReminders(); setInterval(checkReminders, 30000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ checkReminders(); render(); } });
window.OfficeWork = {convertAny, applyImport, buildReport, xlsxBlob, docxBlob, get state(){ return state; }};
</script>
</body>
